name: Radio
options:
  bundleIdPrefix: com.radio
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  RadioBrowserAPI:
    path: Packages/RadioBrowserAPI
  Storage:
    path: Packages/Storage
  UILibrary:
    path: Packages/UILibrary
  Resources:
    path: Packages/Resources
  Architecture:
    path: Packages/Architecture

targets:
  Radio:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Radio/Sources
      - path: Radio/Middleware
      - path: Radio/Assets.xcassets
    info:
      path: Radio/iOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radio.radio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: RadioBrowserAPI
      - package: Storage
      - package: UILibrary
    preBuildScripts:
      - name: SwiftGen
        script: |
          cd "$PROJECT_DIR/Packages/Resources"
          swiftgen config run
        basedOnDependencyAnalysis: false
