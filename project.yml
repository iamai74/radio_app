name: Radio
options:
  bundleIdPrefix: com.radio
  xcodeVersion: "15.0"

packages:
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: 0.65.1
  Needle:
    url: https://github.com/uber/needle.git
    from: "0.25.0"
  RadioBrowserAPI:
    path: Packages/RadioBrowserAPI
  Storage:
    path: Packages/Storage
  UILibrary:
    path: Packages/UILibrary
  Resources:
    path: Packages/Resources
  Architecture:
    path: Packages/Architecture

targets:
  Radio_iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    supportedDestinations: [iOS]
    sources:
      - path: Radio/iOS
      - path: Radio/Middleware
      - path: Radio/Generated
      - path: Radio/Assets.xcassets
      - path: Radio/Flow
    info:
      path: Radio/iOS/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        # Exclude running as a Mac/iPad app on Apple Silicon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Exclude running as a Vision Pro compatible app
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.radio.radio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.4"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
      configs:
        Debug: {}
        Release: {}
    dependencies: &appDependencies
      - package: RadioBrowserAPI
      - package: Storage
      - package: Architecture
      - package: Needle
        product: NeedleFoundation
      - package: Resources
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    scheme: {}
    preBuildScripts: &needleCodegen
      - name: Needle DI Codegen
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v needle >/dev/null 2>&1; then
            echo "error: needle CLI not found. Install it with 'brew install needle' to run DI code generation."
            exit 1
          fi
          export SOURCEKIT_LOGGING=0
          DEST="${SRCROOT}/Radio/Generated/NeedleGenerated.swift"
          TMP="${DERIVED_FILE_DIR}/NeedleGenerated.swift.tmp"
          needle generate "$TMP" "${SRCROOT}/Radio/Middleware"
          if ! cmp -s "$TMP" "$DEST"; then
            mv -f "$TMP" "$DEST"
          fi
    postBuildScripts: []
  Radio_macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Radio/macOS
      - path: Radio/Middleware
      - path: Radio/Generated
      - path: Radio/Flow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radio.macOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.4"
      configs:
        Debug: {}
        Release: {}
    dependencies: *appDependencies
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    scheme: {}
    preBuildScripts: *needleCodegen
    postBuildScripts: []
